# Apple の受け取り在庫 API（/jp/shop/retail/pickup-message）を GitHub Actions から
# 1分間隔で続けて取得できるかの確認用（手動実行のみ）。
# 参考実装（bilune/apple-pickup-monitor）によると Apple はデータセンター IP に HTTP 541 を返す。
# 本番のワークフローができたら削除する。
name: Probe Apple pickup

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "ループを続ける分数"
        default: "60"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Loop
        run: |
          curl -s https://api.ipify.org; echo
          python run_apple_pickup.py --minutes "${{ github.event.inputs.minutes }}"
